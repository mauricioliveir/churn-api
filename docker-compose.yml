services:

  tests:
    build: .
    command: pytest -v
    env_file:
      - .env

  api:
    build: .
    depends_on:
      tests:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
